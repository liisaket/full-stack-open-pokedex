name: Periodic Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
        - name: Check the deployed service URL
          uses: jtalk/url-health-check-action@v5
          with:
            url: https://full-stack-open-pokedex-long-glade-90.fly.dev/
            max-attempts: 3
            retry-delay: 5s